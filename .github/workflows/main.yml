name: zodb-backup QA

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  config:
    uses: ./.github/workflows/config.yml

  lint:
    runs-on: ubuntu-latest
    needs:
      - config
    steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Install the latest version of uv
          uses: astral-sh/setup-uv@v10.0.1
          with:
            python-version: ${{ needs.config.outputs.python-version }}
            cache-python: true
            enable-cache: true
            cache-dependency-glob: |
              **/uv.lock

        - name: Check formatting
          if: ${{ success() || failure() }}
          id: ruff-format
          run: uvx ruff@latest format --diff

        # Deliberately `check`, not `check --diff`: when the only violations are
        # ones ruff cannot auto-fix, `--diff` exits 0 and they pass CI unnoticed.
        # Verified against ruff before choosing this.
        - name: Check lint
          if: ${{ success() || failure() }}
          id: ruff-lint
          run: uvx ruff@latest check

        - name: Check Package Metadata
          if: ${{ success() || failure() }}
          id: pyroma
          run: uvx pyroma@latest -d .

        - name: Check Python Versions
          if: ${{ success() || failure() }}
          id: py-versions
          run: uvx check-python-versions@latest .

        - name: Check typing
          if: ${{ success() || failure() }}
          id: typing
          run: |
            make install
            uv run mypy src

        - name: Report
          if: ${{ success() || failure() }}
          run: |
            echo '# Code Analysis' >> $GITHUB_STEP_SUMMARY
            echo '| Test | Status |' >> $GITHUB_STEP_SUMMARY
            echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
            echo '| Format | ${{ steps.ruff-format.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY
            echo '| Lint | ${{ steps.ruff-lint.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY
            echo '| Package Metadata | ${{ steps.pyroma.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY
            echo '| Python Versions | ${{ steps.py-versions.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY
            echo '| Typing | ${{ steps.typing.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY

  test:
    runs-on: ubuntu-latest
    needs:
      - config
    strategy:
      fail-fast: false
      matrix:
        # Only 3.14 while requires-python is >=3.14. Add versions here and to the
        # classifiers together, or check-python-versions will fail the lint job.
        python-version: ["3.14"]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Install the latest version of uv
          uses: astral-sh/setup-uv@v10.0.1
          with:
            python-version: ${{ matrix.python-version }}
            cache-python: true
            enable-cache: true
            cache-dependency-glob: |
              **/uv.lock

        - name: Run tests
          run: |
            make test

  coverage:
    runs-on: ubuntu-latest
    needs:
      - config
      - test
    steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Install the latest version of uv
          uses: astral-sh/setup-uv@v10.0.1
          with:
            python-version: ${{ needs.config.outputs.python-version }}
            cache-python: true
            enable-cache: true
            cache-dependency-glob: |
              **/uv.lock

        - name: Run tests
          run: |
            make test-coverage

        - name: Report Coverage
          run: |
            echo "# Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "$(uv run coverage report --format markdown)" >> $GITHUB_STEP_SUMMARY

  integration:
    name: Integration tests (live ZEO)
    runs-on: ubuntu-latest
    needs:
      - config
      - test
    steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Install the latest version of uv
          uses: astral-sh/setup-uv@v10.0.1
          with:
            python-version: ${{ needs.config.outputs.python-version }}
            cache-python: true
            enable-cache: true
            cache-dependency-glob: |
              **/uv.lock

        # Builds the image and runs the opt-in suite against a live ZEO server.
        - name: Run integration tests
          run: |
            make test-integration

        - name: Stack logs
          if: ${{ failure() }}
          run: docker compose -f docker-compose.test.yml logs

        - name: Tear down the stack
          if: ${{ always() }}
          run: make stack-down

  build:
    runs-on: ubuntu-latest
    needs:
      - config
    steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Install the latest version of uv
          uses: astral-sh/setup-uv@v10.0.1
          with:
            python-version: ${{ needs.config.outputs.python-version }}
            cache-python: true
            enable-cache: true
            cache-dependency-glob: |
              **/uv.lock

        - name: Build distributions
          run: make build

        - name: Check distributions
          run: uvx twine@latest check dist/*

        - name: Upload distributions
          uses: actions/upload-artifact@v7
          with:
            name: dist
            path: dist/

  container:
    name: "Container Image"
    uses: ./.github/workflows/container-image-build-push.yml
    needs:
      - config
      - lint
      - test
      - integration
    permissions:
      contents: read
      packages: write
    with:
      base-tag: ${{ needs.config.outputs.base-tag }}
      image-name: ${{ needs.config.outputs.image-name }}
      working-directory: .
      # Single arch here; tag.yml builds multi-arch for releases, where the extra
      # emulation time is worth paying for.
      platforms: linux/amd64
      build-args: |
        PYTHON_VERSION=${{ needs.config.outputs.python-version }}
        VERSION=${{ needs.config.outputs.version }}
        VCS_REF=${{ github.sha }}
        BUILD_DATE=${{ needs.config.outputs.build-date }}
      push: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  report:
    name: "Final report"
    # Runs even when something upstream failed, so the summary always reflects
    # what actually happened rather than disappearing with the first failure.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - config
      - lint
      - test
      - coverage
      - integration
      - build
      - container
    steps:
        - name: Write report
          run: |
            echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
            echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
            echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
            echo '| config | ${{ needs.config.result }} |' >> $GITHUB_STEP_SUMMARY
            echo '| lint | ${{ needs.lint.result }} |' >> $GITHUB_STEP_SUMMARY
            echo '| test | ${{ needs.test.result }} |' >> $GITHUB_STEP_SUMMARY
            echo '| coverage | ${{ needs.coverage.result }} |' >> $GITHUB_STEP_SUMMARY
            echo '| integration | ${{ needs.integration.result }} |' >> $GITHUB_STEP_SUMMARY
            echo '| build | ${{ needs.build.result }} |' >> $GITHUB_STEP_SUMMARY
            echo '| container | ${{ needs.container.result }} |' >> $GITHUB_STEP_SUMMARY

        # Makes this one job a usable required status check: red whenever any job
        # it depends on did not succeed or was skipped by a failure upstream.
        - name: Fail if any job failed
          env:
            RESULTS: >-
              ${{ needs.config.result }} ${{ needs.lint.result }}
              ${{ needs.test.result }} ${{ needs.coverage.result }}
              ${{ needs.integration.result }} ${{ needs.build.result }}
              ${{ needs.container.result }}
          run: |
            for result in $RESULTS; do
              if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
                echo "::error::a required job finished with '$result'"
                exit 1
              fi
            done
            echo "every job succeeded"
