name: "Changelog"

on:
  pull_request:
    types: [assigned, opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

jobs:

  config:
    uses: ./.github/workflows/config.yml

  changelog:
    name: Check for a news fragment
    # Dependabot never writes towncrier fragments, and dependency bumps are not
    # changelog-worthy for someone operating this tool. Keyed on the pull
    # request's author rather than github.actor, so the check stays skipped when
    # a maintainer pushes to, or re-runs, a Dependabot pull request.
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    needs:
      - config
    steps:
        - name: Checkout
          uses: actions/checkout@v7
          with:
            # Fetch all history, so towncrier can compare against the base branch.
            fetch-depth: '0'

        - name: Install the latest version of uv
          uses: astral-sh/setup-uv@v10.2.0
          with:
            python-version: ${{ needs.config.outputs.python-version }}
            cache-python: true
            enable-cache: true
            cache-dependency-glob: |
              **/uv.lock

        - name: Check for presence of a Change Log fragment
          run: |
            # Fetch the pull request's base branch so towncrier can compare the
            # current branch against it.
            # Source: https://github.com/actions/checkout/#fetch-all-branches.
            git fetch --no-tags origin ${{ needs.config.outputs.base-branch }}
            uvx towncrier check --compare-with origin/${{ needs.config.outputs.base-branch }} --config pyproject.toml --dir .

  report:
    name: "Final report"
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - config
      - changelog
    steps:
        - name: Write report
          env:
            CONFIG_RESULT: ${{ needs.config.result }}
            CHANGELOG_RESULT: ${{ needs.changelog.result }}
            PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          run: |
            # A bare "skipped" reads as though something went wrong; say why.
            changelog="$CHANGELOG_RESULT"
            if [ "$changelog" = "skipped" ] && [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
              changelog="skipped (dependabot)"
            fi
            {
              echo '# Workflow Report'
              echo '| Job ID | Conclusion |'
              echo '| --- | --- |'
              echo "| config | $CONFIG_RESULT |"
              echo "| changelog | $changelog |"
            } >> "$GITHUB_STEP_SUMMARY"
